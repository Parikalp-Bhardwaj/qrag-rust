[workspace]
resolver = "2"
members = [
    "crates/qrag-core",
    "crates/qrag-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
rig = "0.37.0"
rig-qdrant = "0.2"
qdrant-client = "1"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"